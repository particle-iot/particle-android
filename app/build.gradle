repositories {
    maven { url "https://jitpack.io" }
}


apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: "androidx.navigation.safeargs.kotlin"

// Release signing config is read from a git-ignored keystore.properties at the repo root:
//   storeFile=/absolute/or/relative/path/to/upload.keystore
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}



android {
    namespace 'io.particle.sdk.app'
    compileSdkVersion 35

    defaultConfig {
        applicationId 'io.particle.android.app'
        minSdkVersion 21
        targetSdkVersion 35
        // scheme for these version numbers: EPOCH MAJOR MINOR PATCH BUILD
        versionCode 1_04_00_00_09
        versionName  "4.0.0"

        vectorDrawables.useSupportLibrary = false  // no need for this since we're min SDK=21

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Disable fabric build ID generation for debug builds
            ext.enableCrashlytics = false
        }
    }

    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/main.kotlin_module'
    }

    kotlinOptions {
        jvmTarget = "17"
    }

}


repositories {
    flatDir {
        dirs 'libs'
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation project(':cloudsdk')
    implementation project(':devicesetup')
    implementation project(':mesh')
    implementation project(':meshui')
    implementation project(':commonui')
    api 'org.greenrobot:eventbus:3.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.1'
    implementation "io.github.microutils:kotlin-logging:1.7.8"
    // SLF4J -> android.util.Log binding. Replaces com.github.bright:slf4android (JCenter-only,
    // pulled legacy com.android.support:support-compat). The slf4android-specific config/log-sharing
    // classes are stubbed in-tree under pl.brightinventions.slf4android (file logging + log-attachment
    // sharing are no-ops in the stub).
    implementation 'org.slf4j:slf4j-android:1.7.36'

    // Speed-dial FAB (AndroidX). Replaces the unmaintained, JCenter-only
    // com.getbase:floatingactionbutton, which pulled legacy com.android.support artifacts.
    implementation 'com.leinardi.android:speed-dial:3.3.0'

    // okhttp/okio come transitively from :cloudsdk (okhttp3 4.x / okio 3.x)

    api 'io.github.inflationx:calligraphy3:3.1.1'
    api 'io.github.inflationx:viewpump:2.0.3'

    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.collection:collection-ktx:1.4.5'
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    implementation "androidx.navigation:navigation-fragment-ktx:2.8.5"
    implementation "androidx.navigation:navigation-ui-ktx:2.8.5"

    // FIXME: remove explicit dep here later
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.google.protobuf:protobuf-java:3.5.1'
    // 'com.snakydesign.livedataextensions:lives' (JCenter-only, dead) is vendored into :mesh

    testImplementation 'junit:junit:4.12'
}
